<title>How Walt Sees 42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* One committed look: a card-room at night. Single theme by choice. */
  :root {
    color-scheme: dark;
    --room: #17201c; --room2: #1f2b26; --felt: #24583f; --felt2: #2c6a4c; --rim: #5a3a22;
    --ivory: #f4eedf; --ink: #1f1a14; --text: #eee8da; --dim: #a9b3aa;
    --walt: #5b8fd6; --opp: #e0773a; --pard: #43b0a4; --dice: #d9472f; --gold: #f1c04a;
    --make: #57c285; --set: #e25a4a; --tape: #efe4c8; --tape-ink: #3a2f22;
  }
  html, body { height: 100%; }
  body { background: var(--room); color: var(--text); font: 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; margin: 0; overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; gap: 10px; padding-inline: 16px; padding-block: 12px; box-sizing: border-box; }
  header { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
  .kicker { font: 700 12px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  h1 { font: 800 clamp(24px, 3.4vw, 42px)/1.05 "Bricolage Grotesque", sans-serif; margin: 2px 0 4px; text-wrap: balance; }
  .say { max-width: 78ch; margin: 0; color: var(--text); font-size: clamp(15px, 1.35vw, 19px); min-height: 2.9em; }
  .say b { color: var(--gold); }
  .now { font: 700 13px "JetBrains Mono", monospace; color: var(--dim); text-align: right; white-space: nowrap; }
  main { display: grid; grid-template-columns: minmax(0, 44fr) minmax(0, 56fr); gap: 12px; min-height: 0; }
  .panel { background: var(--room2); border: 1px solid #33443c; border-radius: 10px; position: relative; min-height: 0; overflow: hidden; }
  #table svg { width: 100%; height: 100%; display: block; }
  #tree canvas { width: 100% !important; height: 100% !important; display: block; cursor: grab; }
  .tag { position: absolute; top: 8px; left: 10px; font: 700 11px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
  .hint { position: absolute; bottom: 8px; right: 10px; font-size: 12px; color: var(--dim); pointer-events: none; }
  /* ticker tape */
  .tapewrap { position: relative; height: 54px; background: var(--tape); border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px #c9b98f; }
  .tapewrap::before, .tapewrap::after { content: ""; position: absolute; left: 0; right: 0; height: 6px; background: radial-gradient(circle at 8px 3px, var(--room) 2.2px, transparent 2.6px) 0 0 / 16px 6px repeat-x; }
  .tapewrap::before { top: 2px; } .tapewrap::after { bottom: 2px; }
  #tape { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: center; gap: 0; white-space: nowrap; font: 500 14px "JetBrains Mono", monospace; color: var(--tape-ink); padding-right: 12px; }
  #tape span { padding: 0 14px; border-left: 1px dashed #b9a67a; }
  #tape span.new { background: #ffe89a; }
  #tape span b { color: var(--dice); }
  .tapelabel { position: absolute; left: 0; padding-left: 8px; box-shadow: 8px 0 8px var(--tape); top: 50%; transform: translateY(-50%); font: 700 11px "JetBrains Mono", monospace; letter-spacing: .1em; color: #8b7a55; background: var(--tape); padding-right: 8px; z-index: 1; }
  /* controls */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select { font: 700 14px "Atkinson Hyperlegible", sans-serif; background: #2a3a33; color: var(--text); border: 1px solid #44574d; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #33473e; } button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  button.primary:hover { background: #f6cf6e; }
  .dots { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #3b4c44; cursor: pointer; }
  .dots i.on { background: var(--gold); }
  .extra { display: flex; gap: 8px; }
  .lab { position: absolute; inset: 34px 14px 14px; display: grid; gap: 10px; align-content: start; overflow: auto; }
  .lab table { border-collapse: collapse; width: 100%; font: 500 14px "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  .lab th, .lab td { padding: 4px 6px; text-align: center; border-bottom: 1px solid #33443c; }
  .lab th { color: var(--dim); font-weight: 700; }
  .lab td.pick { color: var(--gold); font-weight: 700; }
  .lab h3 { margin: 4px 0 0; font: 800 17px "Bricolage Grotesque", sans-serif; }
  .lab .note { color: var(--dim); font-size: 14px; margin: 0; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(23,32,28,.78); font: 700 18px "Atkinson Hyperlegible", sans-serif; }
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { height: auto; }
    main { grid-template-columns: 1fr; }
    #table { aspect-ratio: 8 / 7; } #tree { aspect-ratio: 4 / 3; }
    header { grid-template-columns: 1fr; } .now { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { #tape span.new { background: none; } }
</style>

<div class="app">
  <header>
    <div>
      <div class="kicker" id="kicker">How Walt sees 42 · live</div>
      <h1 id="title">How Walt sees 42</h1>
      <p class="say" id="say"></p>
    </div>
    <div class="now" id="now"></div>
  </header>
  <main>
    <section class="panel" id="table"><span class="tag" id="tabletag">the table</span></section>
    <section class="panel" id="tree"><span class="tag">the tree of worlds · drag to turn</span><span class="hint" id="treehint"></span></section>
  </main>
  <div class="tapewrap"><span class="tapelabel">TICKERTAPE</span><div id="tape"></div></div>
  <div class="bar">
    <button id="prev" aria-label="Previous slide">◀ Back</button>
    <button id="next" class="primary" aria-label="Next slide">Next ▶</button>
    <button id="pause" aria-label="Pause or resume">❚❚ Pause</button>
    <button id="step" aria-label="Advance one tick">Step one tick</button>
    <label for="speed" style="font-size:14px;color:var(--dim)">Speed</label>
    <select id="speed"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="12">12×</option></select>
    <span class="extra" id="extra"></span>
    <div class="dots" id="dots" role="tablist" aria-label="Slides"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
const E = window.T42;
const $ = id => document.getElementById(id);
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { walt: CSS('--walt'), opp: CSS('--opp'), pard: CSS('--pard'), dice: CSS('--dice'), gold: CSS('--gold'), make: CSS('--make'), set: CSS('--set'), ivory: CSS('--ivory'), ink: CSS('--ink'), felt: CSS('--felt'), dim: CSS('--dim') };

// ------------------------------------------------------------ the deal
// Walt sits in seat 1 and leads. Fives are trump; Walt's team bid 30.
const WALT = 1;
const SEAT = {
  1: { name: 'Walt', color: COL.walt, pos: 'S' },
  2: { name: 'Lefty', color: COL.opp, pos: 'W' },
  3: { name: 'Partner', color: COL.pard, pos: 'N' },
  0: { name: 'Righty', color: COL.opp, pos: 'E' },
};
const HAND = [[1, 0], [3, 3], [5, 0], [5, 1], [5, 4], [6, 0], [6, 4]].map(([h, l]) => E.idx(h, l));
const HM = E.bitsOf(HAND);
const ST0 = E.start(WALT);
const NW = 8, ALLW = (1 << NW) - 1;
const WORLDS = E.sampleWorlds(WALT, HM, ST0, NW, 1040, null);
const LEADS = E.bits(HM);                     // ascending tile index
const SHOW_LEAD = E.idx(5, 1), SHOW_WORLD = 6, L1_WORLD = 3;

// level 0 walt: best response to dice, on the tape
const DICE = E.diceField();
const S0 = E.makeSolver(WALT, WORLDS, DICE);
const C0 = S0.candidates(ST0);

function rollout(S, field, lead, w) {
  const { path } = S.trace(ST0, w, ALLW, lead);
  let st = ST0; const ev = [];
  for (const p of path) {
    const e = { seat: p.seat, t: p.t, before: st, alive: p.alive, choice: p.choice };
    if (p.seat !== WALT) {
      e.legal = E.bits(E.legal(WORLDS[w].hands[p.seat] & ~st.played, st.trick));
      if (field.kind === 'tape') e.roll = e.legal.indexOf(p.t);
      else e.think = field.cache.get(p.seat + ':' + (WORLDS[w].hands[p.seat] & ~st.played) + ':' + E.recordKey(st));
    } else if (st.log.length) {
      e.options = E.bits(E.legal(HM & ~st.played, st.trick)).map(t => ({ t, makes: S.solve(E.play(st, t), p.alive), of: E.pop(p.alive) }));
    }
    st = E.play(st, p.t); e.after = st; ev.push(e);
  }
  return { ev, end: st, made: st.banked[1] >= E.BID };
}
const R0 = {}; for (const l of LEADS) R0[l] = WORLDS.map((_, w) => rollout(S0, DICE, l, w));

let L1 = null; // level 1: computed on demand (the level-0 minds take a couple of seconds)
function computeL1() {
  if (L1) return L1;
  const f = E.level0Field(8);
  const S = E.makeSolver(WALT, WORLDS, f);
  const C = S.candidates(ST0);
  const R = {}; for (const l of LEADS) R[l] = WORLDS.map((_, w) => rollout(S, f, l, w));
  return (L1 = { f, S, C, R });
}

// ------------------------------------------------------------ run control
let runId = 0, paused = false, stepReq = false, speed = 1;
const STOP = Symbol('stop');
function wait(ms) {
  const id = runId;
  return new Promise((res, rej) => {
    let left = ms, last = performance.now();
    (function tick(now) {
      if (id !== runId) return rej(STOP);
      const dt = now - last; last = now;
      if (!paused) left -= dt * speed;
      if (stepReq) { stepReq = false; left = 0; }
      if (left <= 0) return res();
      requestAnimationFrame(tick);
    })(last);
  });
}
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶ Resume' : '❚❚ Pause'; };
$('step').onclick = () => { if (!paused) { paused = true; $('pause').textContent = '▶ Resume'; } stepReq = true; };
$('speed').onchange = e => { speed = +e.target.value; };

// ------------------------------------------------------------ tape
function tapePrint(html) {
  const t = $('tape');
  for (const s of t.querySelectorAll('span.new')) s.classList.remove('new');
  const s = document.createElement('span'); s.className = 'new'; s.innerHTML = html; t.appendChild(s);
  while (t.children.length > 40) t.removeChild(t.firstChild);
}
const tapeClear = () => { $('tape').innerHTML = ''; };

// ------------------------------------------------------------ the table (SVG)
const NS = 'http://www.w3.org/2000/svg';
const PIP = { 0: [], 1: [[0, 0]], 2: [[-1, -1], [1, 1]], 3: [[-1, -1], [0, 0], [1, 1]], 4: [[-1, -1], [1, -1], [-1, 1], [1, 1]], 5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]], 6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]] };
function domSVG(t, x, y, s, o = {}) {
  const h = E.HI[t], l = E.LO[t];
  let g = `<g transform="translate(${x},${y}) rotate(${o.rot || 0}) scale(${o.sc || 1})" opacity="${o.op ?? 1}">`;
  g += `<rect x="${-s / 2 + 2}" y="${-s + 3}" width="${s}" height="${2 * s}" rx="${s * .18}" fill="rgba(0,0,0,.35)"/>`;
  if (o.down) {
    g += `<rect x="${-s / 2}" y="${-s}" width="${s}" height="${2 * s}" rx="${s * .18}" fill="#264a6e" stroke="#9bbbe0" stroke-width="1.2"/>`;
  } else {
    g += `<rect x="${-s / 2}" y="${-s}" width="${s}" height="${2 * s}" rx="${s * .18}" fill="${COL.ivory}" stroke="${o.ring || '#6b604d'}" stroke-width="${o.ring ? 3 : 1}"/>`;
    g += `<line x1="${-s * .34}" y1="0" x2="${s * .34}" y2="0" stroke="${COL.ink}" stroke-width="1"/>`;
    for (const [v, cy] of [[h, -s / 2], [l, s / 2]]) for (const [px, py] of PIP[v]) g += `<circle cx="${px * s * .26}" cy="${cy + py * s * .26}" r="${s * .085}" fill="${v === E.TRUMP ? COL.dice : COL.ink}"/>`;
  }
  return g + '</g>';
}
const tableSVG = document.createElementNS(NS, 'svg');
tableSVG.setAttribute('viewBox', '0 0 480 430');
$('table').appendChild(tableSVG);
// view = { hands:[m0..m3] full, played, trick:[{seat,t}], faceUp:{seat:bool}, lift:{t:true}, roll:{seat,text}, banked, stamp, bubble }
let VIEW = null;
const POS = { S: [240, 380], N: [240, 58], W: [52, 214], E: [428, 214] };
const TRICKPOS = { S: [240, 262], N: [240, 168], W: [178, 214], E: [302, 214] };
function drawTable(v) {
  VIEW = v;
  let g = `<ellipse cx="240" cy="216" rx="186" ry="132" fill="${CSS('--rim')}"/><ellipse cx="240" cy="214" rx="176" ry="122" fill="${COL.felt}"/>`;
  g += `<ellipse cx="240" cy="214" rx="160" ry="108" fill="none" stroke="${CSS('--felt2')}" stroke-width="2" stroke-dasharray="6 6"/>`;
  for (const seat of [0, 1, 2, 3]) {
    const P = SEAT[seat], [x, y] = POS[P.pos];
    const hand = E.bits((v.hands[seat] || 0) & ~(v.played || 0));
    const up = v.faceUp?.[seat];
    const vert = P.pos === 'W' || P.pos === 'E';
    const s = seat === WALT ? 17 : 13, gap = seat === WALT ? 30 : 23;
    hand.forEach((t, i) => {
      const off = (i - (hand.length - 1) / 2) * gap;
      const lift = v.lift && v.lift.seat === seat ? (v.lift.set.has(t) ? -12 : 0) : 0;
      const pick = v.lift && v.lift.seat === seat && v.lift.pick === t;
      const dx = vert ? (P.pos === 'W' ? -lift : lift) : 0, dy = vert ? 0 : (P.pos === 'N' ? -lift : lift);
      g += domSVG(t, vert ? x + dx : x + off, vert ? y + off : y + dy, s, { down: !up, rot: vert ? 90 : 0, ring: pick ? COL.gold : null, op: v.lift && v.lift.seat === seat && !v.lift.set.has(t) ? .45 : 1 });
    });
    const lx = P.pos === 'W' ? x : P.pos === 'E' ? x : x, ly = P.pos === 'N' ? y - 34 : P.pos === 'S' ? y + 34 : y - 104;
    g += `<text x="${lx}" y="${ly}" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="14" fill="${P.color}">${P.name}${seat === WALT ? '' : P.pos === 'N' ? ' (Walt’s partner)' : ''}</text>`;
  }
  (v.trick || []).forEach(({ seat, t }) => { const [x, y] = TRICKPOS[SEAT[seat].pos]; g += domSVG(t, x, y, 16, { rot: (SEAT[seat].pos === 'W' || SEAT[seat].pos === 'E') ? 90 : 0, ring: SEAT[seat].color }); });
  // score
  if (v.banked) {
    const [o, w] = [v.banked[0], v.banked[1]];
    g += `<g font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">`;
    g += `<text x="10" y="18" fill="${COL.walt}">Walt+Partner ${w}/30</text><rect x="10" y="24" width="120" height="7" rx="3" fill="#33443c"/><rect x="10" y="24" width="${Math.min(120, w * 4)}" height="7" rx="3" fill="${COL.walt}"/>`;
    g += `<text x="470" y="18" text-anchor="end" fill="${COL.opp}">Opponents ${o}/13 sets</text><rect x="350" y="24" width="120" height="7" rx="3" fill="#33443c"/><rect x="${470 - Math.min(120, o * 120 / 13)}" y="24" width="${Math.min(120, o * 120 / 13)}" height="7" rx="3" fill="${COL.opp}"/>`;
    g += `</g>`;
  }
  if (v.roll) {
    const P = SEAT[v.roll.seat], [x, y] = POS[P.pos];
    const bx = P.pos === 'W' ? x + 50 : P.pos === 'E' ? x - 50 : x + 150, by = P.pos === 'N' ? y + 10 : P.pos === 'S' ? y - 70 : y + 118;
    g += `<g transform="translate(${bx},${by}) rotate(${v.roll.spin || 0})"><rect x="-22" y="-22" width="44" height="44" rx="9" fill="${COL.dice}" stroke="${COL.ivory}" stroke-width="2.5"/><text y="9" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="24" fill="${COL.ivory}">${v.roll.face}</text></g>`;
    g += `<text x="${bx}" y="${by + 38}" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" font-weight="700" fill="${COL.ivory}">${v.roll.text}</text>`;
  }
  if (v.bubble) g += v.bubble;
  if (v.stamp) g += `<g transform="translate(240,214) rotate(-8)"><rect x="-110" y="-34" width="220" height="68" rx="10" fill="rgba(23,32,28,.85)" stroke="${v.stamp.color}" stroke-width="5"/><text y="14" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="38" fill="${v.stamp.color}">${v.stamp.text}</text></g>`;
  if (v.caption) g += `<text x="240" y="52" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="13" fill="${COL.dim}">${v.caption}</text>`;
  tableSVG.innerHTML = g;
}
const baseView = (w, faceUp) => ({ hands: w === null ? [0, HM, 0, 0].map((m, s) => s === WALT ? HM : ALLHID(s)) : WORLDS[w].hands, played: 0, trick: [], faceUp, banked: null });
function ALLHID() { return (1 << 7) - 1; } // seven face-down placeholders (tile ids don't matter face down)

// ------------------------------------------------------------ the 3D tree
const tree = (() => {
  const host = $('tree');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1f2b26, 22, 48);
  const camera = new THREE.PerspectiveCamera(42, 1, .1, 200);
  const target = new THREE.Vector3(0, 1.5, 0), goal = new THREE.Vector3(0, 1.5, 0);
  let theta = .6, phi = 1.12, radius = 21, goalR = 21, auto = true, drag = null;
  host.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; auto = false; host.setPointerCapture(e.pointerId); });
  host.addEventListener('pointermove', e => { if (!drag) return; theta -= (e.clientX - drag[0]) * .008; phi = Math.max(.35, Math.min(1.5, phi - (e.clientY - drag[1]) * .006)); drag = [e.clientX, e.clientY]; });
  host.addEventListener('pointerup', () => { drag = null; setTimeout(() => { auto = true; }, 4000); });
  host.addEventListener('wheel', e => { e.preventDefault(); goalR = Math.max(8, Math.min(40, goalR * (1 + e.deltaY * .001))); }, { passive: false });

  const texCache = new Map();
  function domTex(t, ring) {
    const k = t + ring; if (texCache.has(k)) return texCache.get(k);
    const c = document.createElement('canvas'); c.width = 64; c.height = 128; const x = c.getContext('2d');
    x.fillStyle = ring; x.beginPath(); x.roundRect(0, 0, 64, 128, 12); x.fill();
    x.fillStyle = COL.ivory; x.beginPath(); x.roundRect(5, 5, 54, 118, 9); x.fill();
    x.fillStyle = COL.ink; x.fillRect(12, 62, 40, 3);
    for (const [v, cy] of [[E.HI[t], 34], [E.LO[t], 94]]) for (const [px, py] of PIP[v]) { x.fillStyle = v === E.TRUMP ? COL.dice : COL.ink; x.beginPath(); x.arc(32 + px * 13, cy + py * 13, 5.5, 0, 7); x.fill(); }
    const tex = new THREE.CanvasTexture(c); texCache.set(k, tex); return tex;
  }
  function labelTex(lines, bg, fg, w = 256, h = 96) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.fillStyle = bg; x.beginPath(); x.roundRect(0, 0, w, h, 18); x.fill();
    x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
    lines.forEach((s, i) => { x.font = `${i ? 400 : 700} ${i ? 26 : 34}px Atkinson Hyperlegible, sans-serif`; x.fillText(s, w / 2, h / (lines.length + 1) * (i + 1)); });
    return new THREE.CanvasTexture(c);
  }
  function handTex() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 160; const x = c.getContext('2d');
    x.fillStyle = COL.walt; x.beginPath(); x.roundRect(0, 0, 512, 160, 22); x.fill();
    HAND.forEach((t, i) => {
      const ox = 20 + i * 68, oy = 16;
      x.fillStyle = COL.ivory; x.beginPath(); x.roundRect(ox, oy, 56, 112, 9); x.fill();
      x.fillStyle = COL.ink; x.fillRect(ox + 8, oy + 55, 40, 3);
      for (const [v, cy] of [[E.HI[t], 28], [E.LO[t], 84]]) for (const [px, py] of PIP[v]) { x.fillStyle = v === E.TRUMP ? COL.dice : COL.ink; x.beginPath(); x.arc(ox + 28 + px * 12, oy + cy + py * 12, 5, 0, 7); x.fill(); }
    });
    x.fillStyle = COL.ivory; x.font = '700 22px Atkinson Hyperlegible, sans-serif'; x.textAlign = 'center'; x.fillText('Walt’s hand · all he can see', 256, 150);
    return new THREE.CanvasTexture(c);
  }
  const sprite = (tex, w, h) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false })); s.scale.set(w, h, 1); return s; };
  const lineMat = c => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: .75 });
  function seg(a, b, c) { const g = new THREE.BufferGeometry().setFromPoints([a, b]); return new THREE.Line(g, lineMat(c)); }

  const rootPos = new THREE.Vector3(0, 8.2, 0);
  const worldPos = w => { const a = w / NW * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * 6.5, 5, Math.sin(a) * 6.5); };

function tallyView(results, reveal, title, cmp) {

        g += `<text x="80" y="${y - 6}" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="22" fill="${c}">${a}</text>`;
        g += `<text x="80" y="${y + 20}" font-family="Atkinson Hyperlegible, sans-serif" font-size="13.5" fill="${COL.ivory}">${b}</text>`;
        if (i < 2) g += `<path d="M240,${y + 42} v24" stroke="${COL.dim}" stroke-width="3"/><path d="M232,${y + 58} l8,10 l8,-10" fill="none" stroke="${COL.dim}" stroke-width="3"/>`;
      });
      g += `<text x="240" y="420" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="13" fill="${COL.dim}">plays against ↓</text>`;
      tableSVG.innerHTML = g;
      say('What we just watched, <b>rolling dice for everyone else and counting</b>, is itself a player. Call it <b>Level 0</b>. The real Walt is one rung up: he imagines worlds just the same, but he assumes the others are <b>Level-0 players</b> instead of dice.');
      await wait(1500);
      if (!L1) {
        const ov = document.createElement('div'); ov.className = 'overlay'; ov.textContent = 'Level-0 players thinking… (a few seconds)'; $('tree').appendChild(ov);
        await new Promise(r => setTimeout(r, 60));
        const t0 = performance.now(); computeL1(); ov.remove();
        now(`solved in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
      }
      say('Every Level-0 player runs its own little version of what we just watched: its own 8 worlds, its own dice, its own count. We’ll skip the insides and just watch what they decide. Press <b>Next</b>.');
    } },
  { k: 'step 8', title: 'A rollout against thinking players',
    run: async () => {
      resetStage({ worlds: NW, leads: true });
      tapeClear(); computeL1();
      const W1 = L1_WORLD, diceMade = R0[SHOW_LEAD][W1].made;
      now(`world ${W1 + 1} · lead ${N(SHOW_LEAD)} · Level 1`);
      say(`World ${W1 + 1}, lead ${N(SHOW_LEAD)}. Against dice players this world <b>${diceMade ? 'made 30' : 'was set'}</b>. This time the other three don’t roll. Each one <b>thinks</b>, and we see its count as a little bar chart.`);
      await wait(2600);
      const made = await playRollout(L1.R[SHOW_LEAD][W1], SHOW_LEAD, W1, { color: 0xb88fd8 });
      say(`Against thinking players, world ${W1 + 1} <b>${made === diceMade ? (made ? 'still makes' : 'is still set') : made ? 'now makes' : 'now gets set'}</b>. Thinking opponents found the hole that dice missed. The dice haven’t gone away; they’ve moved inside the other players’ heads.`);
    } },
  { k: 'step 9', title: 'How it stacks up',
    run: async () => {
      resetStage({ worlds: NW, leads: true });
      tapeClear(); computeL1();
      const cmp = {}; for (const c of C0) cmp[c.t] = c.makes;
      say('All 56 rollouts again, now against Level-0 players. Purple lines in the tree; the dice results sit alongside for comparison.');
      let reveal = 0; tallyView(L1.R, 0, 'Walt vs Level-0 players', cmp);
      await wait(1400);
      for (const l of LEADS) for (let w = 0; w < NW; w++) {
        const r = L1.R[l][w], li = liOf(l);
        for (let k = 2; k <= r.ev.length + 1; k += 3) { tree.chain(w, li, r.ev, 0xb88fd8, k); await wait(14); }
        tree.endMark(w, li, r.ev, 0xb88fd8, r.made);
        reveal++; tallyView(L1.R, reveal, 'Walt vs Level-0 players', cmp);
        now(`${reveal} of 56 rollouts`);
        await wait(100);
      }
      const best = L1.C.reduce((a, b) => (b.makes > a.makes ? b : a));
      const diffs = L1.C.filter(c => c.makes !== cmp[c.t]).map(c => `${N(c.t)} ${cmp[c.t]}→${c.makes}`).join(', ');
      say(`Walt still leads the <b>${N(best.t)}</b> (${best.makes} of 8). Some other leads changed once the players started thinking: ${diffs}. Defenders who think can punish a lead that dice would forgive.`);
    } },
  { k: 'wrap', title: 'What each sample teaches',
    run: async () => {
      resetStage({ worlds: NW, leads: true });
      const items = [
        ['A world', 'what the hidden hands could be. Possible, not likely.', '#efe4c8'],
        ['A die roll', 'what someone could legally play.', COL.dice],
        ['A rollout', 'one yes or no: made 30, or set.', COL.make],
        ['The count', 'how often each lead makes, exact on these worlds.', COL.gold],
        ['The tape', 'same question, same answer. No lucky rerolls.', '#c9b98f'],
        ['The ladder', 'dice at the bottom, thinking players on top.', '#b88fd8'],
      ];
      let g = '';
      items.forEach(([a, b, c], i) => {
        const x = i % 2 ? 250 : 20, y = 30 + Math.floor(i / 2) * 118;
        g += `<rect x="${x}" y="${y}" width="210" height="108" rx="12" fill="#26352f" stroke="${c}" stroke-width="3"/>`;
        g += `<text x="${x + 14}" y="${y + 32}" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="${c}">${a}</text>`;
        const words = b.split(' '); let line = '', ly = y + 58;
        for (const wd of words) { if ((line + ' ' + wd).length > 24) { g += `<text x="${x + 14}" y="${ly}" font-family="Atkinson Hyperlegible, sans-serif" font-size="14" fill="${COL.ivory}">${line}</text>`; line = wd; ly += 19; } else line = (line ? line + ' ' : '') + wd; }
        g += `<text x="${x + 14}" y="${ly}" font-family="Atkinson Hyperlegible, sans-serif" font-size="14" fill="${COL.ivory}">${line}</text>`;
      });
      g += `<text x="240" y="398" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="12.5" fill="${COL.dim}">A teaching toy: 8 worlds, straight 42, fives trump, bid 30.</text>`;
      g += `<text x="240" y="416" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="12.5" fill="${COL.dim}">Exploratory. The lab numbers are from walt’s probe records, not this page.</text>`;
      tableSVG.innerHTML = g;
      say('The real Walt does exactly this, just bigger: hundreds of worlds, a few more rungs of care. From the lab, on another hand: leading the 5-5 made 30 in <b>all 2,000</b> worlds it tried, and one rung higher (Level 2) agreed. At bottom, it’s all dominoes, dice and a tickertape.');
      now('');
    } },
];

// ------------------------------------------------------------ navigation
let cur = -1;
const dots = $('dots');
SLIDES.forEach((s, i) => { const d = document.createElement('i'); d.title = s.title; d.setAttribute('role', 'tab'); d.onclick = () => go(i); dots.appendChild(d); });
async function go(i) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  cur = i; runId++;
  paused = false; $('pause').textContent = '❚❚ Pause';
  const s = SLIDES[i];
  $('kicker').textContent = `How Walt sees 42 · ${s.k} · ${i + 1}/${SLIDES.length}`;
  $('title').textContent = s.title;
  [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i));
  $('prev').disabled = i === 0; $('next').disabled = i === SLIDES.length - 1;
  try { localStorage.setItem('walt42-slide', String(i)); } catch (e) {}
  try { await s.run(); } catch (e) { if (e !== STOP) console.error(e); }
}
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
addEventListener('keydown', e => {
  if (e.target.closest('select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  else if (e.key === ' ') { e.preventDefault(); $('pause').click(); }
  else if (e.key === '.') $('step').click();
});
const hashSlide = +(location.hash.replace(/\D/g, '') || NaN);
go(Number.isFinite(hashSlide) ? hashSlide - 1 : 0);
</script>
