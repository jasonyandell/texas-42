<title>Walt's Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* One committed look: a card-room at night, with notebooks on the table. Single theme by choice. */
  :root {
    color-scheme: dark;
    --room: #17201c; --room2: #1f2b26; --line: #33443c; --felt: #24583f; --felt2: #2c6a4c; --rim: #5a3a22;
    --ivory: #f4eedf; --ink: #1f1a14; --text: #eee8da; --dim: #a9b3aa;
    --walt: #5b8fd6; --opp: #e0773a; --pard: #43b0a4; --dice: #d9472f; --gold: #f1c04a; --think: #b88fd8;
    --make: #57c285; --set: #e25a4a; --paper: #f3ecd8; --paper-ink: #2d2a24; --rule: #c9d6e6;
  }
  html, body { height: 100%; }
  body { background: var(--room); color: var(--text); font: 16px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; margin: 0; overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; gap: 10px; padding-inline: 16px; padding-block: 12px; box-sizing: border-box; }
  .kicker { font: 700 12px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  h1 { font: 800 clamp(24px, 3.2vw, 40px)/1.05 "Bricolage Grotesque", sans-serif; margin: 2px 0 4px; text-wrap: balance; }
  .say { max-width: 82ch; margin: 0; font-size: clamp(15px, 1.35vw, 19px); min-height: 2.9em; }
  .say b { color: var(--gold); }
  main { display: grid; grid-template-columns: minmax(0, 50fr) minmax(0, 50fr); gap: 12px; min-height: 0; }
  .panel { background: var(--room2); border: 1px solid var(--line); border-radius: 10px; position: relative; min-height: 0; overflow: hidden; }
  .panel svg { width: 100%; height: 100%; display: block; }
  .tag { position: absolute; top: 8px; left: 10px; font: 700 11px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
  /* handbooks */
  #books { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 30px 10px 10px; box-sizing: border-box; height: 100%; }
  .book { background: var(--paper); color: var(--paper-ink); border-radius: 4px 10px 10px 4px; box-shadow: inset 10px 0 0 rgba(0,0,0,.08), 0 2px 0 rgba(0,0,0,.35); padding: 8px 10px 8px 18px; display: flex; flex-direction: column; min-height: 0; position: relative;
          background-image: repeating-linear-gradient(transparent 0 23px, var(--rule) 23px 24px); background-position: 0 38px; transition: box-shadow .2s; }
  .book.active { box-shadow: inset 10px 0 0 rgba(0,0,0,.08), 0 0 0 3px var(--gold); }
  .book h3 { margin: 0; font: 800 15px "Bricolage Grotesque", sans-serif; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .book h3 small { font: 700 10.5px "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #7c7462; }
  .book .rows { margin-top: 6px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; flex: 1; min-height: 0; }
  .row { font: 400 15px/24px "Kalam", cursive; display: flex; gap: 6px; white-space: nowrap; }
  .row .spot { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .book { min-width: 0; }
  .row .pick { font-weight: 700; }
  .row.hit { background: rgba(87,194,133,.35); }
  .row .how { font: 700 10px/24px "JetBrains Mono", monospace; color: #7c7462; }
  .look { position: absolute; left: 10px; right: 10px; bottom: 8px; padding: 6px 10px; border-radius: 6px; font: 700 13px "Atkinson Hyperlegible", sans-serif; display: none; }
  .look.miss { display: block; background: #f7d9d3; color: #7a2418; }
  .look.hit { display: block; background: #cfeedd; color: #1d5a37; }
  .look.think { display: block; background: #e8dcf5; color: #4b2a6b; }
  /* tally */
  .tally { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; background: var(--room2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 40px; }
  .tally .lab { font: 700 11px "JetBrains Mono", monospace; letter-spacing: .1em; color: var(--dim); }
  .tally .lead { display: flex; align-items: center; gap: 6px; font: 700 15px "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  .tally .lead.best { color: var(--gold); }
  .tally .pips { display: flex; gap: 2px; flex-wrap: wrap; max-width: 260px; }
  .tally .pips i { width: 8px; height: 12px; border-radius: 2px; background: var(--make); }
  .tally .pips i.s { background: var(--set); }
  /* controls */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select { font: 700 14px "Atkinson Hyperlegible", sans-serif; background: #2a3a33; color: var(--text); border: 1px solid #44574d; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  button:hover { background: #33473e; } button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); }
  button:disabled { opacity: .4; cursor: default; }
  .dots { display: flex; gap: 5px; margin-left: auto; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #3b4c44; cursor: pointer; }
  .dots i.on { background: var(--gold); }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(23,32,28,.8); font: 700 18px "Atkinson Hyperlegible", sans-serif; }
  @media (max-width: 820px) {
    body { overflow: auto; } .app { height: auto; }
    main { grid-template-columns: 1fr; } #tablep { aspect-ratio: 1 / 1; } #bookp { height: 460px; }
  }
</style>

<div class="app">
  <header>
    <div class="kicker" id="kicker">Walt’s handbook</div>
    <h1 id="title">Walt’s handbook</h1>
    <p class="say" id="say"></p>
  </header>
  <main>
    <section class="panel" id="tablep"><svg id="table" viewBox="0 0 480 440" aria-label="The table"></svg></section>
    <section class="panel" id="bookp"><span class="tag">everyone’s handbook</span><div id="books"></div></section>
  </main>
  <div class="tally" id="tally"></div>
  <div class="bar">
    <button id="prev">◀ Back</button>
    <button id="next" class="primary">Next ▶</button>
    <button id="pause">❚❚ Pause</button>
    <button id="step">Step one tick</button>
    <label for="speed" style="font-size:14px;color:var(--dim)">Speed</label>
    <select id="speed"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="12">12×</option></select>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script src="engine.js"></script>
<script>
'use strict';
const E = window.T42, $ = id => document.getElementById(id), N = t => E.name(t), I = (h, l) => E.idx(h, l);
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { walt: CSS('--walt'), opp: CSS('--opp'), pard: CSS('--pard'), dice: CSS('--dice'), gold: CSS('--gold'), think: CSS('--think'), make: CSS('--make'), set: CSS('--set'), ivory: CSS('--ivory'), ink: CSS('--ink'), felt: CSS('--felt'), felt2: CSS('--felt2'), rim: CSS('--rim'), dim: CSS('--dim') };

// ------------------------------------------------------------ the spot (a real midgame)
// Fives are trump; Walt's team bid 30. Walt sits in seat 1 and is about to lead trick 4.
// The first three tricks were played out by the engine's own level-0 players (seed 1472).
const SEAT = { 1: { name: 'Walt', color: C.walt, pos: 'S' }, 2: { name: 'Lefty', color: C.opp, pos: 'W' }, 3: { name: 'Partner', color: C.pard, pos: 'N' }, 0: { name: 'Righty', color: C.opp, pos: 'E' } };
const HISTORY = [[1, 5, 3], [2, 1, 0], [3, 5, 2], [0, 5, 4], [0, 0, 0], [1, 6, 0], [2, 2, 0], [3, 4, 0], [0, 3, 2], [1, 4, 3], [2, 3, 0], [3, 2, 2]];
let SPOT = E.start(1); for (const [, h, l] of HISTORY) SPOT = E.play(SPOT, I(h, l));
const MY = E.bitsOf([[5, 0], [5, 1], [5, 5], [6, 2]].map(([h, l]) => I(h, l)));
const MOVES = E.bits(MY);
const NW = 24, ALLW = (1 << NW) - 1;
const WORLDS = E.sampleWorlds(1, MY, SPOT, NW, 11 * 1000 + 1472, E.publicVoids(SPOT));
const SHOWN = [4, 11];                                   // the two worlds we tick through, in order
const wname = w => { const k = SHOWN.indexOf(w); return k >= 0 ? `world ${k + 1}` : `world ${w + 1}`; };
const FIVE5 = I(5, 5), FIVE0 = I(5, 0), SIX5 = I(6, 5);

// level 0: everyone else rolls dice (each world keeps its own rolls)
const DICE = E.diceField();
const S0 = E.makeSolver(1, WORLDS, DICE);
const C0 = S0.candidates(SPOT);
// level 1: everyone else picks their best play (computed on demand)
let L1 = null;
function computeL1() { if (!L1) { const f = E.level0Field(8); const S = E.makeSolver(1, WORLDS, f); L1 = { f, S, C: S.candidates(SPOT) }; } return L1; }

// one rollout as a list of events
function rollout(S, field, move, w) {
  const { path, end } = S.trace(SPOT, w, ALLW, move);
  let st = SPOT; const ev = [];
  for (const p of path) {
    const e = { seat: p.seat, t: p.t, before: st, alive: p.alive };
    if (p.seat !== 1) {
      const hand = WORLDS[w].hands[p.seat] & ~st.played;
      e.hand = hand;
      e.legal = E.bits(E.legal(hand, st.trick));
      if (field.kind === 'tape') e.roll = e.legal.indexOf(p.t);
      else e.think = field.cache.get(p.seat + ':' + hand + ':' + E.recordKey(st));
    } else if (st.log.length > SPOT.log.length) {
      e.options = E.bits(E.legal(MY & ~st.played, st.trick)).map(t => ({ t, makes: S.solve(E.play(st, t), p.alive), of: E.pop(p.alive) }));
    }
    st = E.play(st, p.t); e.after = st; ev.push(e);
  }
  return { ev, end, made: end.banked[1] >= E.BID };
}

// ------------------------------------------------------------ run control
let runId = 0, paused = false, stepReq = false, speed = 1;
const STOP = Symbol('stop');
function wait(ms) {
  const id = runId;
  return new Promise((res, rej) => {
    let left = ms, last = performance.now();
    (function tick(now) {
      if (id !== runId) return rej(STOP);
      const dt = now - last; last = now;
      if (!paused) left -= dt * speed;
      if (stepReq) { stepReq = false; left = 0; }
      if (left <= 0) return res();
      requestAnimationFrame(tick);
    })(last);
  });
}
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶ Resume' : '❚❚ Pause'; };
$('step').onclick = () => { if (!paused) { paused = true; $('pause').textContent = '▶ Resume'; } stepReq = true; };
$('speed').onchange = e => { speed = +e.target.value; };
const say = h => { $('say').innerHTML = h; };

// ------------------------------------------------------------ table drawing
const PIP = { 0: [], 1: [[0, 0]], 2: [[-1, -1], [1, 1]], 3: [[-1, -1], [0, 0], [1, 1]], 4: [[-1, -1], [1, -1], [-1, 1], [1, 1]], 5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]], 6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]] };
function dom(t, x, y, s, o = {}) {
  let g = `<g transform="translate(${x},${y}) rotate(${o.rot || 0})" opacity="${o.op ?? 1}"><rect x="${-s / 2 + 2}" y="${-s + 3}" width="${s}" height="${2 * s}" rx="${s * .18}" fill="rgba(0,0,0,.35)"/>`;
  if (o.down) g += `<rect x="${-s / 2}" y="${-s}" width="${s}" height="${2 * s}" rx="${s * .18}" fill="#264a6e" stroke="#9bbbe0" stroke-width="1.2"/>`;
  else {
    g += `<rect x="${-s / 2}" y="${-s}" width="${s}" height="${2 * s}" rx="${s * .18}" fill="${C.ivory}" stroke="${o.ring || '#6b604d'}" stroke-width="${o.ring ? 3 : 1}"/><line x1="${-s * .34}" y1="0" x2="${s * .34}" y2="0" stroke="${C.ink}"/>`;
    for (const [v, cy] of [[E.HI[t], -s / 2], [E.LO[t], s / 2]]) for (const [px, py] of PIP[v]) g += `<circle cx="${px * s * .26}" cy="${cy + py * s * .26}" r="${s * .085}" fill="${v === E.TRUMP ? C.dice : C.ink}"/>`;
  }
  return g + '</g>';
}
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-family="${o.mono ? 'JetBrains Mono, monospace' : o.disp ? 'Bricolage Grotesque, sans-serif' : 'Atkinson Hyperlegible, sans-serif'}" font-weight="${o.w || 700}" font-size="${o.size || 13}" fill="${o.fill || C.ivory}">${s}</text>`;
const POS = { S: [240, 392], N: [240, 70], W: [58, 226], E: [422, 226] };
const TRICK = { S: [240, 290], N: [240, 168], W: [176, 228], E: [304, 228] };
function drawTable(v) {
  let g = `<ellipse cx="240" cy="228" rx="186" ry="134" fill="${C.rim}"/><ellipse cx="240" cy="226" rx="176" ry="124" fill="${C.felt}"/><ellipse cx="240" cy="226" rx="160" ry="110" fill="none" stroke="${C.felt2}" stroke-width="2" stroke-dasharray="6 6"/>`;
  for (const seat of [0, 1, 2, 3]) {
    const P = SEAT[seat], [x, y] = POS[P.pos], vert = P.pos === 'W' || P.pos === 'E';
    const hand = E.bits((v.hands ? v.hands[seat] : seat === 1 ? MY : 0) & ~(v.played ?? 0));
    const n = seat === 1 ? hand.length : (v.hands ? hand.length : v.counts[seat]);
    const s = seat === 1 ? 18 : 14, gap = seat === 1 ? 32 : 25;
    for (let i = 0; i < n; i++) {
      const t = hand[i], off = (i - (n - 1) / 2) * gap, up = seat === 1 || v.faceUp;
      const lifted = v.lift && v.lift.seat === seat && v.lift.set.has(t);
      const d = lifted ? 12 : 0, dx = vert ? (P.pos === 'W' ? d : -d) : 0, dy = vert ? 0 : (P.pos === 'N' ? d : -d);
      g += dom(t, vert ? x + dx : x + off, vert ? y + off : y + dy, s, { down: !up, rot: vert ? 90 : 0, ring: v.lift && v.lift.seat === seat && v.lift.pick === t ? C.gold : null, op: v.lift && v.lift.seat === seat && !lifted ? .4 : 1 });
    }
    const ly = P.pos === 'N' ? y - 36 : P.pos === 'S' ? y + 38 : y - 72;
    g += T(x, ly, P.name + (v.active === seat ? ' ◂' : ''), { fill: P.color, size: 14 });
  }
  (v.trick || []).forEach(({ seat, t }) => { const [x, y] = TRICK[SEAT[seat].pos]; g += dom(t, x, y, 16, { rot: (SEAT[seat].pos === 'W' || SEAT[seat].pos === 'E') ? 90 : 0, ring: SEAT[seat].color }); });
  const [o, w] = v.banked || SPOT.banked;
  g += T(12, 22, `Walt+Partner ${w} / 30`, { a: 'start', mono: 1, size: 12, fill: C.walt }) + `<rect x="12" y="28" width="130" height="7" rx="3" fill="#33443c"/><rect x="12" y="28" width="${Math.min(130, w * 130 / 30)}" height="7" rx="3" fill="${C.walt}"/>`;
  g += T(468, 22, `Opponents ${o} (13 sets)`, { a: 'end', mono: 1, size: 12, fill: C.opp }) + `<rect x="338" y="28" width="130" height="7" rx="3" fill="#33443c"/><rect x="${468 - Math.min(130, o * 10)}" y="28" width="${Math.min(130, o * 10)}" height="7" rx="3" fill="${C.opp}"/>`;
  if (v.die) g += `<g transform="translate(${v.die.x},${v.die.y}) rotate(${v.die.spin || 0})"><rect x="-20" y="-20" width="40" height="40" rx="8" fill="${C.dice}" stroke="${C.ivory}" stroke-width="2.5"/>${T(0, 8, v.die.face, { mono: 1, size: 22 })}</g>` + T(v.die.x, v.die.y + 36, v.die.text, { size: 12 });
  if (v.note) g += T(240, 58, v.note, { size: 12.5, fill: C.dim, w: 400 });
  if (v.stamp) g += `<g transform="translate(240,226) rotate(-8)"><rect x="-112" y="-34" width="224" height="68" rx="10" fill="rgba(23,32,28,.88)" stroke="${v.stamp.color}" stroke-width="5"/>${T(0, 14, v.stamp.text, { disp: 1, size: 38, fill: v.stamp.color })}</g>`;
  if (v.extra) g += v.extra;
  $('table').innerHTML = g;
}
const spotView = () => ({ hands: null, counts: { 0: 4, 2: 4, 3: 4 }, played: SPOT.played, trick: [], banked: SPOT.banked });

// ------------------------------------------------------------ handbooks
// Walt's book is keyed on what Walt sees; it lasts across worlds.
// Dice books (level 0) belong to one world: a new world starts a fresh page.
// Thinking players' books (level 1) are keyed on what that seat sees; they last across worlds.
const BOOK = { 1: new Map(), 2: new Map(), 3: new Map(), 0: new Map() };
const ORDER = [1, 2, 3, 0];
let bookSub = {};
function renderBooks(active, look) {
  $('books').innerHTML = ORDER.map(s => {
    const P = SEAT[s], rows = [...BOOK[s].values()].slice(-7);
    const lk = look && look.seat === s ? `<div class="look ${look.kind}">${look.text}</div>` : '';
    return `<div class="book ${active === s ? 'active' : ''}"><h3><span style="color:${P.color === C.walt ? '#2f5f9e' : P.color === C.pard ? '#1f7d73' : '#b0521c'}">${P.name}’s book</span><small>${bookSub[s] || ''}</small></h3>
      <div class="rows">${rows.map(r => `<div class="row ${r.hit ? 'hit' : ''}"><span class="spot">${r.spot}</span><span class="pick">→ ${r.pick}</span><span class="how">${r.how}</span></div>`).join('')}</div>${lk}</div>`;
  }).join('');
}
function clearBooks(sub) { for (const s of ORDER) BOOK[s].clear(); bookSub = sub || {}; renderBooks(); }
// how a seat describes "this spot": what's on the table right now (and, for thinkers, their own tiles)
function spotText(st, seat, withHand) {
  const tr = st.trick.length ? st.trick.map(N).join(' ') : 'my lead';
  const trickNo = Math.floor(st.log.length / 4) + 1;
  return `trick ${trickNo} · ${tr}${withHand ? ' · mine ' + E.bits(withHand).map(N).join(' ') : ''}`;
}

// ------------------------------------------------------------ tally
let TALLY = {};
function resetTally() { TALLY = {}; for (const m of MOVES) TALLY[m] = []; renderTally(); }
function renderTally(title = 'how often the bid made') {
  const best = Math.max(...MOVES.map(m => TALLY[m].filter(Boolean).length));
  const any = MOVES.some(m => TALLY[m].length);
  $('tally').innerHTML = `<span class="lab">${title.toUpperCase()}</span>` + MOVES.map(m => {
    const r = TALLY[m], k = r.filter(Boolean).length;
    return `<span class="lead ${any && r.length && k === best ? 'best' : ''}">lead ${N(m)} <span class="pips">${r.map(x => `<i class="${x ? '' : 's'}"></i>`).join('')}</span>${r.length ? `${k}/${r.length}` : '–'}</span>`;
  }).join('');
}

// ------------------------------------------------------------ tick one rollout
async function tick(r, move, w, mode, opts = {}) {
  const hands = WORLDS[w].hands;
  const v = { hands, faceUp: true, played: SPOT.played, trick: [], banked: SPOT.banked };
  drawTable(v);
  const slow = opts.slow ?? 1;
  for (let k = 0; k < r.ev.length; k++) {
    const e = r.ev[k], st = e.before, P = SEAT[e.seat];
    v.active = e.seat; v.lift = null; v.die = null; v.extra = null;
    if (e.seat === 1) {
      if (k === 0) {
        say(`Walt tries the move he’s asking about: <b>lead the ${N(e.t)}</b>.`);
        drawTable(v); renderBooks(1); await wait(1500 * slow);
      } else {
        const key = 'W|' + E.recordKey(st), sp = spotText(st, 1);
        if (BOOK[1].has(key)) {
          const row = BOOK[1].get(key); row.hit = true;
          renderBooks(1, { seat: 1, kind: 'hit', text: `Been here before! Same tiles, same table. Play what’s in the book: ${N(row.t)}.` });
          v.lift = { seat: 1, set: new Set([row.t]), pick: row.t }; drawTable(v);
          say(`Walt’s turn. He checks his book: <b>he’s been in exactly this spot before</b>, in an earlier world. Same tiles in his hand, same table. So he plays what he wrote down: <b>${N(e.t)}</b>. He can’t play differently in two worlds that look the same from his chair.`);
          await wait(3800 * slow);
        } else {
          renderBooks(1, { seat: 1, kind: 'miss', text: `Nothing written for this spot yet.` });
          v.lift = { seat: 1, set: new Set((e.options || []).map(o => o.t)), pick: null }; drawTable(v);
          const opts2 = e.options || [];
          if (opts2.length > 1) {
            say(`Walt’s turn. Nothing in his book for this spot. Walt doesn’t roll: he checks each tile against the ${opts2[0].of} world${opts2[0].of > 1 ? 's' : ''} that look${opts2[0].of > 1 ? '' : 's'} like this from his chair (${opts2.map(o => `${N(o.t)} makes in ${o.makes}`).join(', ')}) and writes down the best.`);
          } else say('Walt’s turn. Only one tile is allowed here.');
          await wait((opts2.length > 1 ? 3200 : 1200) * slow);
          BOOK[1].set(key, { spot: sp, pick: N(e.t), t: e.t, how: opts2.length > 1 ? 'thought' : 'only one' });
          v.lift.pick = e.t; drawTable(v); renderBooks(1); await wait(700 * slow);
        }
      }
    } else if (mode === 'dice') {
      const key = w + '|' + E.recordKey(st), sp = spotText(st, e.seat), n = e.legal.length;
      v.lift = { seat: e.seat, set: new Set(e.legal), pick: null };
      renderBooks(e.seat, { seat: e.seat, kind: 'miss', text: `Looked up “${sp}”: nothing here.` });
      say(`${P.name} looks at <b>his own dominoes</b> and the table, nothing else. He checks his book for this spot: nothing. So he picks at random among the <b>${n}</b> tile${n > 1 ? 's' : ''} he’s allowed to play, and scribbles it down.`);
      const [px, py] = POS[P.pos], dx = P.pos === 'W' ? 110 : P.pos === 'E' ? -110 : 150, dy = P.pos === 'N' ? 30 : P.pos === 'S' ? -60 : 110;
      const t0 = performance.now();
      if (n > 1) while (performance.now() - t0 < 900 * slow / speed) { v.die = { x: px + dx, y: py + dy, face: 1 + Math.floor(Math.random() * n), spin: Math.random() * 40 - 20, text: `rolling 1–${n}` }; drawTable(v); await wait(60); }
      v.die = { x: px + dx, y: py + dy, face: e.roll + 1, text: n > 1 ? `#${e.roll + 1} of ${n} → ${N(e.t)}` : `only ${N(e.t)}` }; v.lift.pick = e.t; drawTable(v);
      await wait(900 * slow);
      BOOK[e.seat].set(key, { spot: sp, pick: N(e.t), how: n > 1 ? '🎲' : 'only one' });
      renderBooks(e.seat); await wait(600 * slow);
    } else { // thinking players
      const key = e.seat + ':' + e.hand + ':' + E.recordKey(st), sp = spotText(st, e.seat, e.hand);
      v.lift = { seat: e.seat, set: new Set(e.legal), pick: null };
      if (BOOK[e.seat].has(key)) {
        const row = BOOK[e.seat].get(key); row.hit = true;
        renderBooks(e.seat, { seat: e.seat, kind: 'hit', text: `Been here before, same tiles too. Play ${N(e.t)}.` });
        say(`${P.name} checks his book: same tiles, same table as in an earlier world. <b>Play what’s written: ${N(e.t)}.</b>`);
        v.lift.pick = e.t; drawTable(v); await wait(2600 * slow);
      } else if (e.legal.length === 1) {
        renderBooks(e.seat, { seat: e.seat, kind: 'miss', text: `Only one tile allowed: ${N(e.t)}.` });
        say(`${P.name} has only one tile he’s allowed to play: <b>${N(e.t)}</b>.`);
        v.lift.pick = e.t; drawTable(v); await wait(1300 * slow);
        BOOK[e.seat].set(key, { spot: sp, pick: N(e.t), how: 'only one' });
      } else {
        const th = e.think, good = E.team(e.seat) === 1;
        renderBooks(e.seat, { seat: e.seat, kind: 'think', text: `Nothing here. Thinking it through…` });
        v.extra = bubble(e.seat, th, good); drawTable(v);
        say(`${P.name} looks at <b>his own dominoes</b> and the table. Nothing in his book, so instead of rolling he <b>thinks</b>: he imagines 8 worlds of his own (with dice for everyone else), tries each tile, and picks the one that’s best for ${good ? 'his team' : 'stopping Walt'}: <b>${N(e.t)}</b>.`);
        await wait(3600 * slow);
        BOOK[e.seat].set(key, { spot: sp, pick: N(e.t), how: 'thought' });
        v.lift.pick = e.t; v.extra = null; drawTable(v); renderBooks(e.seat); await wait(600 * slow);
      }
    }
    // play the tile
    v.lift = null; v.die = null; v.extra = null;
    v.played = e.after.played;
    const cur = e.after.trick.length ? e.after.log.slice(e.after.log.length - e.after.trick.length) : e.before.log.slice(e.before.log.length - e.before.trick.length).concat([{ seat: e.seat, t: e.t }]);
    v.trick = cur; drawTable(v);
    await wait(450 * slow);
    if (e.after.lastTrick) {
      const L = e.after.lastTrick; v.banked = e.after.banked; drawTable(v);
      say(`${SEAT[L.winner].name} wins the trick (${L.pts} point${L.pts > 1 ? 's' : ''}). Walt’s side ${e.after.banked[1]}, opponents ${e.after.banked[0]}.` + (opts.onTrick ? ' ' + opts.onTrick(L, e.after) : ''));
      await wait(1900 * slow);
      v.trick = []; drawTable(v);
    }
  }
  v.active = null;
  v.stamp = { text: r.made ? 'MADE 30' : 'SET', color: r.made ? C.make : C.set };
  v.note = r.made ? `settled early: Walt’s side reached ${r.end.banked[1]}` : `settled early: opponents reached ${r.end.banked[0]}, and 13 sets a 30 bid`;
  drawTable(v); renderBooks();
  return r.made;
}
function bubble(seat, th, good) {
  if (!th || !th.vals) return '';
  const P = SEAT[seat], vals = th.vals, w = Math.max(250, 44 * vals.length + 30);
  const bx = Math.max(8 + w / 2, Math.min(472 - w / 2, P.pos === 'W' ? 170 : P.pos === 'E' ? 310 : 240)), by = P.pos === 'N' ? 150 : 250;
  let g = `<rect x="${bx - w / 2}" y="${by - 60}" width="${w}" height="120" rx="14" fill="${C.ivory}" stroke="${C.think}" stroke-width="3"/>`;
  g += T(bx, by - 40, `${P.name}: “in my 8 worlds, Walt’s side makes…”`, { fill: C.ink, size: 12 });
  vals.forEach((v, i) => {
    const cx = bx - (vals.length - 1) * 22 + i * 44, h = 6 + v.makes / v.of * 40;
    g += `<rect x="${cx - 10}" y="${by + 16 - h}" width="20" height="${h}" fill="${v.t === th.t ? C.gold : '#b8ad96'}"/>` + T(cx, by + 10 - h, v.makes, { fill: C.ink, size: 11, mono: 1 });
    g += dom(v.t, cx, by + 38, 9, { ring: v.t === th.t ? C.gold : null });
  });
  return g;
}

}

// re-enact a rollout into the books without animation (used when jumping into a later slide)
function replayInto(r, w, mode) {
  for (const e of r.ev.slice(1)) {
    const st = e.before;
    if (e.seat === 1) { const key = 'W|' + E.recordKey(st); if (!BOOK[1].has(key)) BOOK[1].set(key, { spot: spotText(st, 1), pick: N(e.t), t: e.t, how: (e.options || []).length > 1 ? 'thought' : 'only one' }); }
    else if (mode === 'dice') BOOK[e.seat].set(w + '|' + E.recordKey(st), { spot: spotText(st, e.seat), pick: N(e.t), how: e.legal.length > 1 ? '🎲' : 'only one' });
  }
}

// ------------------------------------------------------------ navigation
let cur = -1;
SLIDES.forEach((s, i) => { const d = document.createElement('i'); d.title = s.title; d.onclick = () => go(i); $('dots').appendChild(d); });
async function go(i) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i)); cur = i; runId++;
  paused = false; $('pause').textContent = '❚❚ Pause';
  const s = SLIDES[i];
  $('kicker').textContent = `Walt’s handbook · ${s.k} · ${i + 1}/${SLIDES.length}`;
  $('title').textContent = s.title;
  [...$('dots').children].forEach((d, j) => d.classList.toggle('on', j === i));
  $('prev').disabled = i === 0; $('next').disabled = i === SLIDES.length - 1;
  try { await s.run(); } catch (e) { if (e !== STOP) console.error(e); }
}
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
addEventListener('keydown', e => {
  if (e.target.closest('select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  else if (e.key === ' ') { e.preventDefault(); $('pause').click(); }
  else if (e.key === '.') $('step').click();
});
go(0);
