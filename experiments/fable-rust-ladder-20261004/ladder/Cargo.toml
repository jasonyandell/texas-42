[package]
name = "ladder"
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
publish = false

[workspace]

[dependencies]
walt = { path = "../walt-fork", default-features = false, features = ["cpu-speedups"] }
serde_json = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
debug = false
incremental = false
