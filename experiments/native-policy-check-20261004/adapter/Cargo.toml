[package]
name = "native-late-player"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
walt = { path = "../../../walt/walt", default-features = false, features = ["cpu-speedups"] }
walt-player = { path = "../../../walt/walt-player", default-features = false, features = ["cpu-speedups"] }
serde_json = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
debug = false
strip = "debuginfo"
incremental = false

