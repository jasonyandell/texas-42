[package]
name = "inner-vector-seam"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["cpu-speedups"]
cpu-speedups = ["walt/cpu-speedups"]

[dependencies]
walt = { path = "../../../walt/walt", default-features = false }
serde_json = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
debug = false
strip = "debuginfo"
incremental = false
