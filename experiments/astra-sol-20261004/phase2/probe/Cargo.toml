[package]
name = "walt-substitution-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
walt = { path = "../../../../walt/walt", default-features = false, features = ["cpu-speedups"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true

