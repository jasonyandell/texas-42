[workspace]
resolver = "2"
members = ["walt-core", "walt-kernel", "walt-geom", "walt-strat"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
walt-core = { path = "walt-core" }
walt-kernel = { path = "walt-kernel" }
walt-geom = { path = "walt-geom" }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"

# Exact arithmetic: a silent wrap is a wrong count, so check in every profile.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true
