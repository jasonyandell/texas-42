[package]
name = "walt-player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel", "cpu-speedups"]
cpu-speedups = ["walt/cpu-speedups"]
parallel = ["walt/parallel"]

[dependencies]
walt = { path = "../walt", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"
