[package]
name = "walt-m3-metal"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "UNLICENSED"
publish = false

# Freeze 57 is intentionally staged without changing the freeze-56 workspace
# manifest or lockfile.  This nested workspace makes the new crate testable in
# isolation until the final M3 source closure admits it into the parent graph.
[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
float_arithmetic = "deny"

[profile.release]
overflow-checks = true
