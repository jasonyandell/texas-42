[workspace]
resolver = "2"
members = ["crates/core", "crates/player", "crates/verify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
proptest = "1"

# INV-4 EXACT-ARITHMETIC: checked arithmetic in every profile.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true
